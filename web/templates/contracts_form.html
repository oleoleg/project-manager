{{ define "contracts_form.html" }}
{{ template "layout_header" . }}
{{ $c := .Contract }}
{{ $isNew := .IsNew }}

<p class="back-link">
    <a href="{{ if $isNew }}/contracts{{ else }}/contracts/{{ $c.ID }}{{ end }}">← Назад</a>
</p>

<div class="page-header">
    <h2>{{ if $isNew }}Новый договор{{ else }}Договор {{ $c.ID }}{{ end }}</h2>
</div>

{{ if .Error }}<div class="error">{{ .Error }}</div>{{ end }}

<form method="post" action="{{ if $isNew }}/contracts{{ else }}/contracts/{{ $c.ID }}{{ end }}" class="form">

    <label>
        ID договора
           <small class="hint">
                Рекомендуется: 4 цифры номера проекта + необязательный суффикс через дефис.
                Например: <code>6666</code>, <code>6666-W</code>, <code>6666-W2</code>.
                Буквы (латиница): W — монтаж, S — поставка, D — проектирование.
            </small>
            <input type="text" name="id" value="{{ $c.ID }}" maxlength="16"
                {{ if not $isNew }}readonly{{ end }} required>
    </label>

    <label>
        № договора
        <input type="text" name="contract_number" value="{{ $c.ContractNumber }}" required>
    </label>

    <label>
        Дата составления
        <input type="date" name="contract_date" value="{{ if $c.ContractDate }}{{ $c.ContractDate.Format "2006-01-02" }}{{ end }}">
    </label>

    <label>
        Наименование работ
        <input type="text" name="work_name" value="{{ $c.WorkName }}">
    </label>

    <label>
        Ответственное лицо (главный РП по договору)
        <small class="hint">Выбирается из активных пользователей. ФИО подставится автоматически.</small>
        <select name="responsible_user_id">
            <option value="">— не назначен —</option>
            {{ range .ActiveUsers }}
                <option value="{{ .ID }}" {{ if and $c.ResponsibleUserID (eq (derefInt $c.ResponsibleUserID) .ID) }}selected{{ end }}>
                    {{ .FullName }} ({{ .Username }})
                </option>
            {{ end }}
        </select>
    </label>

 
    <label>
        Статус
        <select name="status_code" required>
            {{ range .Statuses }}
                <option value="{{ .Code }}" {{ if eq .Code $c.StatusCode }}selected{{ end }}>{{ .Code }} — {{ .Name }}</option>
            {{ end }}
        </select>
    </label>

    <label>
        Контрагент *
        <select name="counterparty_id" required>
            <option value="">— выберите —</option>
            {{ range .Counterparties }}
                <option value="{{ .ID }}" {{ if eq .ID $c.CounterpartyID }}selected{{ end }}>{{ .ID }} — {{ .Name }}</option>
            {{ end }}
        </select>
    </label>

    <label>
        Тип договора *
        <select name="contract_type" required>
            <option value="">— выберите —</option>
            {{ range .Types }}
                <option value="{{ .Code }}" {{ if eq .Code $c.ContractType }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </label>

    <label>
        Цех
        <input type="text" name="workshop" value="{{ $c.Workshop }}">
    </label>

    <label>
        Путь к корню проекта *
        <small class="hint">
            Папка проекта — корень, от которого строятся все подпапки (ТКП, Договор, Реализация).
            Пример UNC: <code>\\Work\otr\workplace\0000 ЗАКАЗЧИК\0000 ПРОЕКТ</code>.<br>
            Пример локального: <code>D:\Projects\4288 Реконструкция СЖА</code>.
        </small>
        <div class="file-input-row">
            <input type="text" name="project_url" id="contract-project-url"
                   value="{{ $c.ProjectURL }}"
                   placeholder="\\Work\otr\workplace\...\0000 ПРОЕКТ" required>
            <button type="button" class="btn" id="btn-pick-dir">📁 Обзор…</button>
        </div>
    </label>

    <label>
        Статус карты закупки
        <select name="procurement_card_status">
            <option value="">— не указано —</option>
            {{ range .ProcurementStatuses }}
                <option value="{{ .Code }}" {{ if eq .Code (deref $c.ProcurementCardStatus) }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </label>

    <label>
        Статус финплана
        <select name="finplan_status">
            <option value="">— не указано —</option>
            {{ range .TrackingStatuses }}
                <option value="{{ .Code }}" {{ if eq .Code (deref $c.FinplanStatus) }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </label>

    <label>
        Статус план-графика
        <select name="plan_schedule_status">
            <option value="">— не указано —</option>
            {{ range .TrackingStatuses }}
                <option value="{{ .Code }}" {{ if eq .Code (deref $c.PlanScheduleStatus) }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </label>

    <label>
        Краткое имя
        <input type="text" name="short_name" value="{{ $c.ShortName }}">
    </label>

    <label>
        Доп. реквизиты
        <textarea name="extra_details" rows="3">{{ $c.ExtraDetails }}</textarea>
    </label>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ if $isNew }}/contracts{{ else }}/contracts/{{ $c.ID }}{{ end }}" class="btn">Отмена</a>
    </div>

</form>


<script>
    // Выбор папки проекта через pm-agent://pick-dir
    (function () {
        const btn = document.getElementById('btn-pick-dir');
        const field = document.getElementById('contract-project-url');
        if (!btn || !field) return;

        let pollTimer = null;
        let pollStartedAt = 0;

        btn.addEventListener('click', (e) => {
            e.preventDefault(); // Предотвращаем стандартное поведение

            // Создаем невидимую ссылку и кликаем по ней (браузеры это любят больше)
            const a = document.createElement('a');
            a.href = 'pm-agent://pick-dir';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            if (pollTimer) clearInterval(pollTimer);
            pollStartedAt = Date.now();
            
            // Опрашиваем сервер каждые 500 мс
            pollTimer = setInterval(checkPickedPath, 1000);
        });

        function checkPickedPath() {
            // Ждем максимум 2 минуты
            if (Date.now() - pollStartedAt > 120000) {
                clearInterval(pollTimer);
                pollTimer = null;
                return;
            }

            fetch('/api/picked-path?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    // Если пришел путь и он новее, чем начало клика
                    if (data && data.path && data.mtime > pollStartedAt) {
                        field.value = data.path;
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                })
                .catch(() => {});
        }
    })();
</script>

{{ template "layout_footer" . }}
{{ end }}
