{{ define "layout_header" }}
<!DOCTYPE html>
<html lang="ru" {{ if .User }}data-theme="{{ if eq .User.Theme "dark" }}dark{{ else }}light{{ end }}"{{ else }}data-theme="light"{{ end }}>
<head>
    <meta charset="UTF-8">
    <title>{{ .Title }} — Project Manager</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/formats.js"></script>
    <script src="/static/app.js" defer></script>
    <script src="/static/act_kinds.js" defer></script>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/layout.js" defer></script>
</head>
<body>
{{ if .User }}
<header>
    <div class="header-inner">
        <div class="brand">
            <a href="/dashboard">Project Manager</a>
        </div>
        <nav class="main-nav">
            <a href="/dashboard">Дашборд</a>
            <a href="/counterparties">Контрагенты</a>
            <a href="/contracts">Договоры</a>
            <a href="/reports">Рапорт</a>
            <a href="https://github.com/oleoleg/project-manager/wiki" target="_blank">Справка</a>
        </nav>
        <div class="user-box">
            <div class="user-dropdown-wrapper">
                <button type="button" class="user-trigger" id="user-menu-btn">
                    <span class="user-name">{{ .User.FullName }}</span>
                    <span class="user-role">{{ .RoleName }}</span>
                </button>
                <div class="user-menu" id="user-menu">
                    <a href="/settings">Профиль</a>
                    {{ if eq .User.RoleCode "admin" }}
                        <a href="/admin/users">Пользователи</a>
                     {{ end }}
                    <div class="menu-divider"></div>
                    <form method="post" action="/logout" class="inline">
                        <button type="submit">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
{{ end }}
<main>
    {{ if .Flash }}<div class="flash">{{ .Flash }}</div>{{ end }}
{{ end }}

{{ define "layout_footer" }}
</main>
</body>
</html>
{{ end }}
