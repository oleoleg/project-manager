{{ define "tab_costs_summary" }}
<div id="tab-summary" class="tab-content" style="display: none;">
    {{ if .Snapshot }}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-top: 20px; margin-bottom: 20px;">
       
        <!-- 1. Большой пирог (Разбивка суммы Договора) -->
        <div class="card" style="padding: 20px; position: relative; display: flex; flex-direction: column; height: 620px;">
            <h3 style="text-align: center; margin-bottom: 2px;">Разбивка суммы Договора</h3>
            <div id="expenses-total-sum" style="text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px;"></div>
            <div style="height: 400px; position: relative; min-height: 100px;">
                <canvas id="expensesChart"></canvas>
            </div>
            <!-- Сюда JS вставит HTML-легенду -->
            <div id="expenses-legend"></div>
        </div>

        <!-- 2. Маленький пирог (Разбивка прибыли по Отделам) -->
        <div class="card" style="padding: 20px; position: relative; display: flex; flex-direction: column;">
            <h3 style="text-align: center; margin-bottom: 15px;">Разбивка прибыли по Отделам</h3>
            <div id="profit-total-sum" style="text-align: center; font-size: 18px; font-weight: bold; color: #28a745; margin-bottom: 15px;"></div>
            <div style="height: 240px; position: relative; min-height: 100px;">
                <canvas id="profitChart"></canvas>
            </div>
            <!-- Сюда JS вставит HTML-легенду -->
            <div id="profit-legend"></div>
        </div>
        
        <!-- 3. Маленький пирог (Разбивка затрат по Отделам) -->
        <div class="card" style="padding: 20px; position: relative; display: flex; flex-direction: column;">
            <h3 style="text-align: center; margin-bottom: 15px;">Разбивка затрат по Отделам</h3>
            <div id="departments-total-sum" style="text-align: center; font-size: 18px; font-weight: bold; color: #ff6384; margin-bottom: 15px;"></div>
            <div style="height: 240px; position: relative; min-height: 100px;">
                <canvas id="departmentsChart"></canvas>
            </div>
            <!-- Сюда JS вставит HTML-легенду -->
            <div id="departments-legend"></div>
        </div>
    </div>
    
    <!-- Временной график -->
    <div class="card" style="padding: 20px; margin-top: 20px; position: relative;">
        <h3 style="text-align: center; margin-bottom: 15px;">Динамика</h3>
        
        <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 15px; align-items: center;">
            <label style="font-size: 14px; display: flex; align-items: center; gap: 8px;">
                Детализация: 
                <select id="timeline-group" class="btn btn-sm" onchange="updateTimeline()" style="padding: 4px 8px; border: 1px solid var(--border);">
                    <option value="week">По неделям</option>
                    <option value="month" selected>По месяцам</option>
                    <option value="quarter">По кварталам</option>
                </select>
            </label>
            
            <label style="font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="timeline-negative-expense" onchange="updateTimeline()">
                Затраты в минус
            </label>
        </div>

        <div style="height: 400px; position: relative;">
            <canvas id="timelineChart"></canvas>
        </div>
        
        <!-- Контейнер для кастомной легенды -->
        <div id="timeline-legend" style="margin-top: 15px;"></div>
    </div>
    {{ else }}
        <p>Нет данных для построения графиков.</p>
    {{ end }}
</div>
{{ end }}
